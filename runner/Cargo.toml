[package]
name = "harvest-bench"
version = "0.1.0"
edition = "2021"
description = "Crash-isolating, budget-aware GoogleTest runner for validating shared-library reimplementations against upstream test suites"
license = "MIT"

[lib]
name = "harvest_bench"
path = "src/lib.rs"

[[bin]]
name = "harvest-bench"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[workspace]
